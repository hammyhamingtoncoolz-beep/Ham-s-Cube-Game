name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/hams-cube-game.exe dist/
          Copy-Item build/Release/assets dist/assets -Recurse
          Compress-Archive dist/* Ham-s-Cube-Game-v0.01a-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Ham-s-Cube-Game-v0.01a-windows
          path: Ham-s-Cube-Game-v0.01a-windows.zip

